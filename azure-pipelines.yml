trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  NODE_VERSION: '18'
  ACR_SERVICE_CONNECTION: 'CMGAMER'
  ACR_REPOSITORY: 'backend'
  SONAR_TOKEN: $(SONAR_TOKEN)

steps:
- checkout: self

- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '$(NODE_VERSION)'

- script: npm ci
  displayName: 'Install dependencies'

# SonarCloud preparation (conditional on token present)
- task: SonarCloudPrepare@1
  condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''), ne(variables['SONAR_TOKEN'], 'PLACEHOLDER'))
  inputs:
    SonarCloud: 'SonarCloud'
    organization: 'tu-organizacion'
    scannerMode: 'CLI'
    configMode: 'manual'
    cliProjectKey: 'CMGAMER_BACKEND'
    cliProjectName: 'CM Gamer Backend'
    extraProperties: |
      sonar.sources=.
      sonar.exclusions=**/node_modules/**,**/__tests__/**,coverage/**
      sonar.javascript.lcov.reportPaths=coverage/lcov.info

- script: |
    docker run -d --name test-db -e POSTGRES_PASSWORD=postgres -e POSTGRES_USER=postgres -e POSTGRES_DB=gamemarket -p 5432:5432 postgres:15
    echo 'Waiting for Postgres...'
    for i in $(seq 1 15); do docker exec test-db pg_isready -U postgres && break || sleep 2; done
  displayName: 'Start ephemeral Postgres for tests'

- script: |
    DATABASE_URL=postgres://postgres:postgres@localhost:5432/gamemarket npm test -- --coverage
  displayName: 'Run tests with coverage'

- task: PublishBuildArtifacts@1
  displayName: 'Publish coverage artifact'
  condition: succeeded()
  inputs:
    PathtoPublish: 'coverage'
    ArtifactName: 'coverage'
    publishLocation: 'Container'

- task: SonarCloudAnalyze@1
  condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''), ne(variables['SONAR_TOKEN'], 'PLACEHOLDER'))

- task: SonarCloudPublish@1
  condition: and(succeeded(), ne(variables['SONAR_TOKEN'], ''), ne(variables['SONAR_TOKEN'], 'PLACEHOLDER'))
  inputs:
    pollingTimeoutSec: '300'

- script: docker rm -f test-db || true
  condition: always()
  displayName: 'Cleanup test DB'

- task: Docker@2
  displayName: 'Build & Push image'
  inputs:
    containerRegistry: '$(ACR_SERVICE_CONNECTION)'
    repository: '$(ACR_REPOSITORY)'
    command: 'buildAndPush'
    Dockerfile: 'Dockerfile'
    buildContext: '.'
    tags: |
      $(Build.BuildId)
      latest
